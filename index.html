<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoldenHour AI</title>
<style>
:root{--bg:#f1f5f7;--ink:#14212b;--mut:#51606c;--line:#cfd9df;--card:#fff;--red:#b3261e;--redbg:#fdeceb;--teal:#0f5f73}
*{box-sizing:border-box}
body{margin:0;font:17px/1.5 system-ui,"Noto Sans Tamil","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center}
h1{font-size:19px;margin:0;flex:1}h2{font-size:18px;margin:0 0 10px}
select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
a.call{background:var(--red);color:#fff;font-weight:700;text-decoration:none;padding:12px 16px;border-radius:10px;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.emg{background:var(--redbg);border:2px solid var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.btn{font:inherit;min-height:52px;padding:10px 14px;border-radius:10px;border:2px solid var(--teal);background:#fff;color:var(--teal);font-weight:600;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.pri,.btn.pri{background:var(--teal);color:#fff}
button.red,.btn.red{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
textarea,input{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:4px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.h{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.m{color:var(--mut);font-size:15px}pre{white-space:pre-wrap;background:#f6f8f9;padding:10px;border-radius:8px;font:15px/1.5 inherit;margin:0 0 10px}
footer{max-width:640px;margin:0 auto;padding:0 14px 30px;color:var(--mut);font-size:14px}
#tm{font-size:28px;font-weight:700}
@media print{header,footer,.np{display:none!important}}
</style></head><body>
<header><h1>GoldenHour AI</h1>
<select id="lg" aria-label="Language"><option value="en">English</option><option value="ta">தமிழ்</option><option value="hi">हिन्दी</option></select>
<a class="call" id="c1" href="tel:108"></a></header>
<main id="app"></main>
<footer>Student hackathon prototype. Not a medical device. It does not diagnose and cannot rule out an emergency. If you think it is an emergency, call 108 or 112 now.</footer>
<script>
// ===== SETTINGS =====
const API_URL = "https://goldenhour-ai.onrender.com"; // optional: your backend URL that calls an LLM and returns symptom JSON. Never put an API key here.
// Optional: add verified hospitals here, e.g. {n:"Name",t:["stroke","general"],lat:13.08,lng:80.27,p:"+914412345678"}. Leave empty to use live map data only.
const HOSP=[];
// ===== TEXT (have a native speaker review Tamil and Hindi) =====
const T={
en:{call:"Call 108",tap:"What is happening? Tap one:",desc:"Or describe it in your own words",go:"Check",
 emg:"Call 108 or 112 now",y:"Yes",n:"No",u:"Not sure",ask:"Is this happening?",nomatch:"I couldn’t recognise a symptom in your text, so I will ask a few questions. You can also go back and tap the closest symptom.",
 doc:"I can’t rule out an emergency. Please see a doctor soon, and call 108 right away if things get worse.",
 steps:["Note the time the symptoms started","Give no food, water or medicines","Keep them seated or lying safely","Unlock the door and keep the medicine list ready"],
 L:{face_drooping:"Face drooping",arm_or_leg_weakness:"Arm or leg weakness",speech_trouble:"Speech trouble",sudden_vision_loss:"Sudden vision loss",sudden_severe_headache:"Sudden severe headache",sudden_confusion_or_dizziness:"Sudden confusion or dizziness",chest_pain:"Chest pain",breathing_trouble:"Breathing trouble",seizure:"Seizure",unconsciousness:"Unconscious"}},
ta:{call:"108-க்கு அழைக்கவும்",tap:"என்ன நடக்கிறது? ஒன்றைத் தொடவும்:",desc:"அல்லது உங்கள் மொழியில் விவரிக்கவும்",go:"சரிபார்",
 emg:"இப்போதே 108 அல்லது 112-க்கு அழைக்கவும்",y:"ஆம்",n:"இல்லை",u:"தெரியவில்லை",ask:"இது நடக்கிறதா?",nomatch:"உங்கள் எழுத்தில் அறிகுறியை என்னால் அடையாளம் காண முடியவில்லை. சில கேள்விகள் கேட்கிறேன்.",
 doc:"அவசர நிலை இல்லை என்று என்னால் உறுதி செய்ய முடியாது. தயவுசெய்து மருத்துவரைப் பார்க்கவும். நிலை மோசமானால் உடனே 108-க்கு அழைக்கவும்.",
 steps:["அறிகுறி தொடங்கிய நேரத்தைக் குறித்துக் கொள்ளுங்கள்","உணவு, தண்ணீர், மருந்து எதுவும் கொடுக்காதீர்கள்","அவரை பாதுகாப்பாக அமர வைக்கவும் அல்லது படுக்க வைக்கவும்","கதவைத் திறந்து வைத்து, மருந்துப் பட்டியலை தயாராக வைக்கவும்"],
 L:{face_drooping:"முகம் கோணலாக உள்ளது",arm_or_leg_weakness:"கை/கால் பலவீனம்",speech_trouble:"பேச்சு குழறுகிறது",chest_pain:"நெஞ்சு வலி",breathing_trouble:"மூச்சுத் திணறல்",unconsciousness:"மயக்கம்"}},
hi:{call:"108 पर कॉल करें",tap:"क्या हो रहा है? एक चुनें:",desc:"या अपनी भाषा में बताएं",go:"जांचें",
 emg:"अभी 108 या 112 पर कॉल करें",y:"हाँ",n:"नहीं",u:"पता नहीं",ask:"क्या यह हो रहा है?",nomatch:"मैं आपके लिखे में लक्षण पहचान नहीं पाया, इसलिए कुछ सवाल पूछ रहा हूँ।",
 doc:"मैं आपात स्थिति से इनकार नहीं कर सकता। कृपया डॉक्टर से मिलें। हालत बिगड़े तो तुरंत 108 पर कॉल करें।",
 steps:["लक्षण शुरू होने का समय नोट करें","खाना, पानी या दवा न दें","उन्हें सुरक्षित बैठाएं या लिटाएं","दरवाजा खुला रखें और दवाओं की सूची तैयार रखें"],
 L:{face_drooping:"चेहरा टेढ़ा",arm_or_leg_weakness:"हाथ/पैर कमजोर",speech_trouble:"बोलने में दिक्कत",chest_pain:"सीने में दर्द",breathing_trouble:"सांस लेने में तकलीफ",unconsciousness:"बेहोश"}}};
const VOICE={en:"en-IN",ta:"ta-IN",hi:"hi-IN"};
let lang="en",nm=0,callTap=0,amb={},Q=[],sym={},view=()=>{},pos=null,onset=null,qi=0,timer=null;
const $=id=>document.getElementById(id);
const t=k=>T[lang][k]??T.en[k];
const lab=k=>(T[lang].L||{})[k]||T.en.L[k];
// ===== SAFETY RULES (plain code, the AI never decides) =====
const KEYS=Object.keys(T.en.L);
const STROKE=KEYS.slice(0,6),QT=["face_drooping","arm_or_leg_weakness","speech_trouble","chest_pain","breathing_trouble","unconsciousness"],ASK=QT.slice(0,5);
const RX={
face_drooping:/face|droop|mouth|lip|முகம்|முக|வாய்|வாய|கோண|சாய்ந|இழுத்|இழுக்|வளைந்|mugam|muham|vaai|vai kon|koni|चेहरा|चेहरे|मुंह|मुँह|टेढ|लटक|chehra|munh|\bmuh\b|tedh|latak/i,
arm_or_leg_weakness:/\b(arm|leg|hand)\b|weak|numb|paraly|கை|கால்|காலில்|பலவீன|பலமில்ல|உணர்வ|மரத்து|தளர்|அசைக்க|\bkai\b|\bkaal\b|balaveen|marathu|thalar|हाथ|पैर|पांव|कमज|सुन्न|haath|\bpair\b|kamzor|\bsunn/i,
speech_trouble:/speech|slur|can.t speak|cannot speak|trouble speaking|talk|பேச்சு|பேச முடி|பேச வர|பேசவே|பேசல|உளற|குழற|திக்|வார்த்தை|pechu|pesa mudiy|pesa varala|ulara|kulara|thikk|बोल नहीं|बोल ना|बोलने में|बोल पा|बोल सक|बोलते नहीं|ुबान|लड.?खड|अटक|bol nahi|bolne|zubaan|jubaan/i,
sudden_vision_loss:/vision|can.t see|cannot see|blind|பார்வை|கண் தெரி|கண்ணு தெரி|दिखाई|अंधा|paarvai|dikhai/i,
sudden_severe_headache:/headache|head ache|தலைவலி|தலை வலி|सिरदर्द|सिर दर्द|सिर में दर्द|thalai vali|thalaivali|sir dard/i,
sudden_confusion_or_dizziness:/confus|dizz|giddy|தலைசுற்ற|தலை சுற்ற|சுற்றுத|குழப்ப|उलझन|चक्कर|भ्रम|बहक|kulapp|thalai sutr|chakkar/i,
chest_pain:/chest|heart|நெஞ்|மார்ப|இதய|nenju|nenchu|nenjil|maarbu|idhayam|idayam|सीने|सीना|छाती|दिल में|दिल का|हार्ट|seene|seena|chhati|chaati|dil mein/i,
breathing_trouble:/breath|மூச்|சுவாச|திணற|moochu|moochi|swasam|thinaral|सांस|साँस|दम घुट|दम फूल|saans|dam ghut/i,
seizure:/seizure|\bfits?\b|convuls|வலிப்ப|இழுப்பு|valippu|valipu|दौरा|मिर्गी|झटके|daura|mirgi|jhatke/i,
unconsciousness:/unconscious|faint|collapse|not respond|unresponsive|passed out|black(?:ed)? out|மயங்|மயக்|சுயநினைவ|நினைவு இல்|நினைவில்ல|நினைவிழ|கீழே விழ|mayang|mayakk|moorcha|ninaivu illa|बेहोश|होश नहीं|होश में नहीं|अचेत|गिर पड|गिर गय|गिर गए|behosh|hosh nahi/i};
function clean(s){const r={};KEYS.forEach(k=>{const v=String(s[k]??"unknown").trim().toLowerCase();r[k]=v=="yes"||v=="no"?v:"unknown"});return r}
function decide(s){s=clean(s);const hits=KEYS.filter(k=>s[k]=="yes");
 if(hits.length)return{level:"EMERGENCY",hits};
 return{level:KEYS.some(k=>s[k]=="unknown")?"NOT_CLEAR":"NO_SIGNS_REPORTED",hits:[]}} // no "safe" level on purpose
async function extract(text){
 text=text.normalize("NFC").replace(/[\u200b-\u200d\ufeff]/g,"");const s={};for(const k in RX)if(RX[k].test(text))s[k]="yes"; // keyword backstop always runs
 if(API_URL){try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,lang})});
  const a=clean(await r.json());KEYS.forEach(k=>{if(a[k]=="yes")s[k]="yes"})}catch(e){}}
 return s}
// ===== VIEWS =====
function setLang(v){lang=v;document.documentElement.lang=v;$("c1").textContent=t("call");view()}
function home(){view=home;clearInterval(timer);
 app.innerHTML=`<div class="card"><h2>${t("tap")}</h2><div class="grid">${QT.map(k=>`<button class="pri" onclick="tapSym('${k}')">${lab(k)}</button>`).join("")}</div></div>
 <div class="card"><h2>${t("desc")}</h2><textarea id="tx" rows="4"></textarea><div class="row"><button onclick="mic()" aria-label="Voice">🎤</button><button class="pri" onclick="analyze()">${t("go")}</button></div><p id="vs" class="m"></p></div>
 <details class="card"><summary>Patient profile (saved on this device only)</summary>
 <input id="pn" placeholder="Name"><input id="pa" placeholder="Age"><input id="pc" placeholder="Known conditions"><input id="pm" placeholder="Medicines"><input id="pt" placeholder="Family contact number"></details>`;
 try{const p=JSON.parse(localStorage.gh||"{}");["pn","pa","pc","pm","pt"].forEach(i=>{$(i).value=p[i]||""})}catch(e){}
 ["pn","pa","pc","pm","pt"].forEach(i=>$(i).oninput=()=>{try{localStorage.gh=JSON.stringify(Object.fromEntries(["pn","pa","pc","pm","pt"].map(j=>[j,$(j).value])))}catch(e){}})}
function tapSym(k){sym={[k]:"yes"};nm=0;finish()}
async function analyze(){const x=$("tx").value.trim();if(!x)return;sym=await extract(x);nm=Object.keys(sym).length==0;finish()}
function finish(){const d=decide(sym);if(d.level=="EMERGENCY")return result(d);
 sym=clean(sym);Q=ASK.filter(k=>sym[k]=="unknown");qi=0;ask()}
function ask(){view=ask;if(qi>=Q.length)return docView();const k=Q[qi];
 app.innerHTML=`${nm&&qi==0?`<div class="card"><p>${t("nomatch")}</p></div>`:""}<div class="card"><p class="m">${qi+1} / ${Q.length}</p><h2>${t("ask")}<br>${lab(k)}</h2>
 <div class="row"><button class="pri" onclick="ans('${k}','yes')">${t("y")}</button><button onclick="ans('${k}','no')">${t("n")}</button><button onclick="ans('${k}','unknown')">${t("u")}</button></div></div>`}
function ans(k,v){sym[k]=v;if(v=="yes")return result(decide(sym));qi++;ask()}
function docView(){view=docView;app.innerHTML=`<div class="card"><h2>${t("doc")}</h2></div><div class="card"><div id="hs"></div></div>
 <div class="row np"><button onclick="home()">←</button></div>`;hosp("general")}
function stype(hits){return hits.some(k=>STROKE.includes(k))?"stroke":hits.includes("chest_pain")?"cardiac":"general"}
function result(d){view=()=>result(d);const ty=stype(d.hits);onset=onset||new Date();
 const p=prof();const warn=/diabet|sugar|சர்க்கரை|मधुमेह/i.test(p.pc||"")?`<p class="m">Low blood sugar can look like a stroke. Check sugar only if it does not delay the 108 call.</p>`:"";
 app.innerHTML=`<div class="card emg"><h2>${t("emg")}</h2><div class="row"><a class="btn red" href="tel:108" onclick="callTap=1">108</a><a class="btn red" href="tel:112">112</a></div>
 <p>${d.hits.map(lab).join(", ")}</p></div>
 <div class="card"><h2>Ambulance (details from the 108 operator)</h2><p class="m">Type what the operator tells you. This is not live tracking.</p>
 <input id="an" placeholder="Driver name" value="${amb.n||""}"><input id="ap" type="tel" placeholder="Driver phone" value="${amb.p||""}"><input id="av" placeholder="Ambulance number" value="${amb.v||""}"><input id="ae" type="number" min="0" placeholder="Arrives in (minutes, operator estimate)" value="${amb.e||""}"><p id="bk" class="m"></p><textarea id="ax" rows="2" placeholder="Paste the operator’s message, or speak the details"></textarea><div class="row"><button onclick="mic('ax')" aria-label="Voice">🎤</button><button onclick="parseAmb()">Fill details</button></div><div id="ad"></div></div>
 <div class="card"><label>Symptoms started at <input id="on" type="time" value="${hm(onset)}"></label><div id="tm"></div></div>
 <div class="card"><h2>While you wait</h2><ol>${t("steps").map(s=>`<li>${s}</li>`).join("")}</ol>${warn}<button onclick="speak()">🔊</button><p id="sv" class="m"></p></div>
 <div class="card"><div id="hs"></div></div>
 <div class="card"><h2>Hospital handoff</h2><pre id="ho"></pre>
 <label><input type="checkbox" id="cs" style="width:auto"> I agree to share this health information with the person I choose.</label>
 <div class="row np"><button onclick="share()">WhatsApp</button><button onclick="window.print()">Print</button></div></div>
 <div class="row np"><button onclick="sym={};onset=null;amb={};home()">←</button></div>`;
 $("on").onchange=e=>{const[h,m]=e.target.value.split(":");const n=new Date();n.setHours(h,m,0,0);if(n>new Date())n.setDate(n.getDate()-1);onset=n;tick()};
 clearInterval(timer);timer=setInterval(tick,30000);tick();hosp(ty);ambBind();
 window.hits=d.hits}
const hm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
function prof(){try{return JSON.parse(localStorage.gh||"{}")}catch(e){return{}}}
function tick(){const m=Math.max(0,Math.floor((new Date()-onset)/60000));if($("tm"))$("tm").textContent=m+" min";
 const p=prof(),h=window.hits||[];if($("ho"))$("ho").textContent=
 `GOLDENHOUR AI: FAMILY-REPORTED HANDOFF (not a medical assessment)\nPatient: ${p.pn||"-"}, age ${p.pa||"-"}\nSigns reported by family: ${h.map(k=>T.en.L[k]).join(", ")}\nSymptoms started about: ${hm(onset)} (${m} min ago)\nKnown conditions: ${p.pc||"-"}\nMedicines: ${p.pm||"-"}\nFamily contact: ${p.pt||"-"}\nAmbulance: ${amb.v||"-"}, driver ${amb.n||"-"} ${amb.p||""}, ${eta()}`;ambShow()}
const ph=v=>String(v||"").replace(/[^\d+]/g,"");
function eta(){if(!amb.t)return"ETA -";return"ETA about "+Math.max(0,Math.round((amb.t-Date.now())/60000))+" min (operator estimate)"}
function mob(v){let d=String(v||"").replace(/\D/g,"");if(d.length==12&&d.startsWith("91"))d=d.slice(2);if(d.length==11&&d[0]=="0")d=d.slice(1);return /^[6-9]\d{9}$/.test(d)?d:""}
function ambShow(){const d=$("ad");if(!d)return;const m=mob(amb.p);
 d.innerHTML=(m?`<a class="btn red" href="tel:+91${m}">Call now: ${m.slice(0,5)} ${m.slice(5)}</a> `:(ph(amb.p)?`<button disabled>Call now (enter all 10 digits)</button> `:""))+(amb.t?`<p><b>${eta()}</b></p>`:"")+(amb.v||amb.n?`<p class="m">${amb.v||""} ${amb.n||""}</p>`:"")}
function ambBind(){[["an","n"],["ap","p"],["av","v"]].forEach(([i,k])=>$(i).oninput=e=>{amb[k]=e.target.value;ambShow();tick()});
 $("ae").oninput=e=>{amb.e=e.target.value;amb.t=e.target.value===""?null:Date.now()+Number(e.target.value)*60000;ambShow();tick()};ambShow()}
function parseAmb(){const x=$("ax").value;
 const ph1=x.match(/\+?\d[\d\s-]{8,}\d/),v=x.match(/\b[A-Z]{2}[\s-]?\d{1,2}[\s-]?[A-Z]{1,3}[\s-]?\d{3,4}\b/i),e=x.match(/(\d{1,3})\s*(?:min|mins|minutes|நிமிட|मिनट)/i),n=x.match(/driver(?:\s*name)?\s*[:\-]?\s*([A-Za-z]+(?:\s[A-Za-z]+)?)/i);
 if(ph1)amb.p=ph(ph1[0]);if(v)amb.v=v[0].toUpperCase();if(e){amb.e=e[1];amb.t=Date.now()+Number(e[1])*60000}
 if(n)amb.n=n[1].replace(/\b(phone|ph|mobile|mob|number|no|arriving|will|is)\b.*$/i,"").trim();
 $("an").value=amb.n||"";$("ap").value=amb.p||"";$("av").value=amb.v||"";$("ae").value=amb.e||"";ambShow();tick()}
$("c1").onclick=()=>{callTap=1};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&callTap&&$("bk")){callTap=0;$("bk").textContent="Back from the call? Enter or paste what the operator told you.";$("bk").scrollIntoView({behavior:"smooth",block:"center"})}});
function share(){if(!$("cs").checked){alert("Please tick the consent box first.");return}
 window.open("https://wa.me/?text="+encodeURIComponent($("ho").textContent))}
function speak(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t("steps").join(". "));u.lang=VOICE[lang];speechSynthesis.speak(u);const vs=speechSynthesis.getVoices(),has=!vs.length||vs.some(v=>v.lang.replace("_","-").toLowerCase().startsWith(lang)),m=$("sv");if(m)m.textContent=has?"":"This phone may have no voice installed for this language, so you may hear nothing or English. Install it in the phone’s text-to-speech settings."}
function mic(id="tx"){const R=window.SpeechRecognition||window.webkitSpeechRecognition,s=$("vs")||$("bk");
 if(!R){s.textContent="Voice typing is not supported in this browser. Use the microphone on your phone keyboard instead.";return}
 const r=new R();r.lang=VOICE[lang];r.interimResults=true;r.continuous=false;s.textContent="Listening… speak now";
 r.onresult=e=>{$(id).value=Array.from(e.results).map(x=>x[0].transcript).join(" ")};
 r.onerror=e=>{s.textContent=({"not-allowed":"The microphone is blocked. Allow it in the browser settings.","service-not-allowed":"The microphone is blocked. Allow it in the browser settings.","no-speech":"I heard nothing. Try again, closer to the phone.","language-not-supported":"Voice typing does not support this language here. Use the microphone on your phone keyboard.","network":"Voice typing needs an internet connection."})[e.error]||("Voice error: "+e.error)};
 r.onend=()=>{if(s.textContent.startsWith("Listening"))s.textContent=""};
 try{r.start()}catch(e){s.textContent="Could not start the microphone."}}
// ===== HOSPITALS =====
function km(a,b,c,d){const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))}
function hosp(ty){const el=$("hs");let live=null,note='<p class="m">Looking for hospitals near you…</p>';
 const draw=()=>{let l=(live||HOSP.filter(h=>h.t.includes(ty))).map(h=>({...h,d:pos?km(pos.lat,pos.lng,h.lat,h.lng):null}));
  l.sort((a,b)=>(a.d??1e9)-(b.d??1e9));l=l.slice(0,6);
  el.innerHTML=`<h2>${live?"Nearest hospitals":"Nearby hospitals"}</h2><p class="m">Call 108 first. ${live?"List from OpenStreetMap: names, numbers and distances may be missing or out of date, and it cannot show which hospitals treat stroke or heart attacks. Call ahead to confirm.":"Call ahead to confirm."} Live bed data is not available.</p>${note}<a class="btn pri" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("hospital near "+(pos?pos.lat+","+pos.lng:"me"))}">Open hospitals in Google Maps</a>`+
  l.map(h=>`<div class="h"><div><b>${h.n}</b><br><span class="m">${h.d==null?"distance unavailable":h.d.toFixed(1)+" km (straight line)"}${h.p?" · "+h.p:""}</span></div><div style="display:flex;gap:6px">${live?`<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lng}">Map</a>`:""}${ph(h.p)?`<a class="btn pri" href="tel:${ph(h.p)}">Call</a>`:`<button disabled>No number</button>`}</div></div>`).join("")};
 const load=()=>{const c=new AbortController();setTimeout(()=>c.abort(),15000);
  const q=`[out:json][timeout:20];nwr(around:6000,${pos.lat},${pos.lng})[amenity=hospital];out center 100;`;
  fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q),signal:c.signal}).then(r=>r.json()).then(j=>{
   const a=(j.elements||[]).map(e=>{const t=e.tags||{};return{n:t.name||t["name:en"]||"Hospital (no name listed)",lat:e.lat??(e.center&&e.center.lat),lng:e.lon??(e.center&&e.center.lon),p:(t.phone||t["contact:phone"]||"").split(";")[0].trim()}}).filter(h=>h.lat!=null);
   const nm2=a.filter(h=>!/no name listed/.test(h.n));if(nm2.length)a.splice(0,a.length,...nm2);
   if(a.length){live=a;note=""}else note='<p class="m">No hospitals found within 6 km on the map data. Use the Google Maps button below.</p>';draw()}).catch(()=>{note='<p class="m">Could not load nearby hospitals (no internet or the map service is busy). Use the Google Maps button below.</p>';draw()})};
 draw();
 if(pos)load();else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};draw();load()},()=>{note='<p class="m">Location is blocked, so I cannot find hospitals near you. Allow location in the browser settings and reload, or use the Google Maps button below.</p>';draw()});
 else{note='<p class="m">This browser has no location support. Use the Google Maps button below.</p>';draw()}}
$("lg").onchange=e=>setLang(e.target.value);
const app=$("app");setLang("en");home();
